# Per-push checks for the npm package. Publishing lives in release.yml.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    name: install · build · typecheck · test
    if: vars.OSS_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
      - name: Wait for sibling packages on the registry
        # Sibling deps are exact pins re-stated at the release cut, and a
        # release wave pushes every sibling within seconds of each other:
        # this CI runs on that push while the sibling's own release lane is
        # still queued, so the pin it installs may not exist yet. Bounded
        # above the release lane's wait because CI starts earlier than the
        # two hosted jobs that publish the sibling.
        run: |
          set -euo pipefail
          deps=$(jq -r '((.dependencies // {}) + (.peerDependencies // {}))
                        | to_entries[] | select(.key | startswith("@mcpg-dev/"))
                        | "\(.key)@\(.value)"' package.json)
          [ -z "$deps" ] && { echo "no sibling packages"; exit 0; }
          for d in $deps; do
            echo "waiting for $d"
            found=""
            for _ in $(seq 1 120); do
              if npm view "$d" version >/dev/null 2>&1; then found=1; break; fi
              sleep 10
            done
            [ -n "$found" ] || { echo "::error::$d never appeared on the registry"; exit 1; }
          done
      # Unlocked on purpose: no lockfile ships with the source, so the
      # install resolves fresh.
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Typecheck
        run: |
          set -euo pipefail
          if jq -e '.scripts.typecheck' package.json >/dev/null; then npm run typecheck; fi
      - name: Test
        run: |
          set -euo pipefail
          if jq -e '.scripts.test' package.json >/dev/null; then npm test; fi
